
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Your personal AI interface, NEXOR.">
  <title>NEXOR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --cyan: #55eaff;
      --blue: #168bd8;
      --panel: #071321;
      --border: #28cfff66;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #e8f4ff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(ellipse at 50% 15%, #12365a 0%, transparent 55%),
        linear-gradient(180deg, #030812, #071321 60%, #02050b);
      background-attachment: fixed;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 20px;
      color: #7deaff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-shadow: 0 0 12px #19cfff88;
      border-bottom: 1px solid var(--border);
      background: #06101bcc;
    }

    header::after {
      content: "AI SYSTEM";
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    main {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 30px 18px;
    }

    .system-label {
      margin: 0;
      color: var(--cyan);
      text-align: center;
      font-size: 10px;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #22cfff88;
    }

    .core {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 140px;
      height: 140px;
      margin: 38px auto 30px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      color: #79eaff;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 2px;
      background: radial-gradient(circle, #123d60 0%, #06101e 70%);
      box-shadow:
        0 0 18px #16cfff88,
        0 0 45px #168bd844,
        inset 0 0 30px #168bd855;
      animation: corePulse 3s ease-in-out infinite;
    }

    .core::before,
    .core::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }

    .core::before {
      inset: -11px;
      border: 1px dashed #54dfff99;
      animation: coreRotate 12s linear infinite;
    }

    .core::after {
      inset: 8px;
      border: 1px solid #54dfff66;
      box-shadow: inset 0 0 18px #22ccff55;
    }

    h1 {
      margin: 18px 0 10px;
      color: #e5faff;
      text-align: center;
      font-size: 27px;
      text-shadow: 0 0 18px #35cfff66;
    }

    .status {
      color: #75dfff;
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
    }

    #chat {
      min-height: 170px;
      margin-top: 28px;
      padding: 16px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.8;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(145deg, #0a1a2b, #050b14);
      box-shadow:
        0 0 22px #087ab522,
        inset 0 0 20px #087ab511;
    }

    .chat-label {
      display: block;
      margin-bottom: 12px;
      padding-bottom: 10px;
      color: var(--cyan);
      font-size: 10px;
      letter-spacing: 2px;
      border-bottom: 1px solid #2bd8ff44;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 90px;
      margin-top: 14px;
      padding: 14px;
      color: white;
      background: #071321;
      border: 1px solid #35cfff88;
      border-radius: 12px;
      font: inherit;
      resize: vertical;
      outline: none;
    }

    textarea::placeholder {
      color: #7295b4;
    }

    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 16px #22cfff44;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      color: #04101c;
      background: linear-gradient(100deg, #43cfff, #83f4ff);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 0 18px #25cfff44;
      font: inherit;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    #notice {
      min-height: 1.5em;
      color: #75dfff;
      font-size: 12px;
    }

    footer {
      padding: 24px;
      color: #7189a4;
      text-align: center;
      font-size: 12px;
      letter-spacing: 3px;
    }

    @keyframes corePulse {
      0%, 100% {
        box-shadow:
          0 0 18px #16cfff88,
          0 0 45px #168bd844,
          inset 0 0 30px #168bd855;
      }
      50% {
        box-shadow:
          0 0 28px #16cfffbb,
          0 0 65px #168bd866,
          inset 0 0 40px #168bd877;
      }
    }

    @keyframes coreRotate {
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 600px) {
      main {
        padding-top: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>NEXOR</header>

  <main>
    <p class="system-label">SYSTEM ONLINE // NEXOR-01</p>

    <div class="core" aria-label="NEXOR core">NEXOR</div>

    <h1>おかえり。</h1>
    <p class="status">PERSONAL AI INTERFACE · ONLINE</p>

    <div id="chat" role="log" aria-live="polite">
      <span class="chat-label">LIVE INTERFACE</span>NEXOR：起動しました。
ここから、君専用のAIを作っていこう。
    </div>

    <form id="messageForm">
      <textarea
        id="message"
        rows="3"
        maxlength="2000"
        placeholder="NEXORにメッセージを入力…"
        aria-label="NEXORへのメッセージ"
      ></textarea>
      <button type="submit">送信</button>
    </form>

    <p id="notice" role="status"></p>
  </main>

  <footer>NEXOR · PERSONAL ASSISTANT</footer>

  <script>
    const form = document.getElementById("messageForm");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const notice = document.getElementById("notice");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const value = input.value.trim();

      if (!value) {
        notice.textContent = "メッセージを入力してね。";
        input.focus();
        return;
      }

      chat.appendChild(document.createElement("br"));
      chat.appendChild(document.createElement("br"));
      chat.appendChild(document.createTextNode("君：" + value));

      chat.appendChild(document.createElement("br"));
      chat.appendChild(document.createElement("br"));
      chat.appendChild(
        document.createTextNode(
          "NEXOR：メッセージを受け取ったよ。AI機能はこれから接続するね。"
        )
      );

      input.value = "";
      notice.textContent = "メッセージを受け取ったよ。";
    });
  </script>
</body>
</html>
